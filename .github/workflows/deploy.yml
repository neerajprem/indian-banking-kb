# Main branch: build, test and deploy to S3 behind CloudFront using GitHub OIDC (no stored AWS keys).
# Repository variables to set: AWS_ROLE_ARN, BUCKET, DISTRIBUTION_ID, SITE_URL. See RUNBOOK.md.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    # Runs only when the AWS route is configured; on Cloudflare Pages or Netlify hosting this job is skipped.
    if: ${{ vars.BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BUCKET: ${{ vars.BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Deploy
        run: scripts/deploy.sh --skip-build
      - name: Print the security headers for this build (compare with the CloudFront policy)
        run: node scripts/csp-header.mjs
