  status: verified
- id: rbi-former-nhb
  from: rbi
  to: nhb
  type: ownership
  label: Former owner (stake sold in 2019)
  description: RBI sold its entire NHB stake to the Government of India on 19 March 2019.
  source: rbi-nabard-nhb-divest-2019
  status: verified
- id: nhb-hfc-to-rbi
  from: nhb
  to: rbi
  type: regulatory
  label: Housing finance regulation moved to RBI (2019)
  description: Regulation of housing finance companies moved from NHB to RBI from 9 August 2019; NHB still supervises them.
  source: nhb-about
  status: verified
- id: rbi-points-to-cersai
  from: rbi
  to: cersai
  type: regulatory
  label: RBI circulars point lenders to CERSAI's registry
  description: RBI informed securitisation and reconstruction companies and cooperative banks about registering security interests with CERSAI.
