- id: dicgc
  short: DICGC
  full: Deposit Insurance and Credit Guarantee Corporation
  group: rbi-subsidiary
  category: Wholly owned subsidiary of RBI, established under the DICGC Act, 1961
  headquarters: Mumbai
  established: 1978
  establishedNote: Formed in 1978 by merging the Deposit Insurance Corporation (operating since 1 January 1962) with the Credit Guarantee Corporation of India.
  employeesNote: not yet sourced
  roles:
  - Insures bank deposits up to ₹5 lakh per depositor per bank
  - Pays depositors when an insured bank fails or is placed under restrictions
  - Collects deposit insurance premiums from banks (risk-based from 2026)
  relations:
  - rbi
  officialUrl: https://www.dicgc.org.in
  sources:
  - dicgc-leaflet
  - dicgc-history
  - dicgc-guide
  - icra-dicgc-rbp-2026
  status: verified
