- id: rbi
  short: RBI
  full: Reserve Bank of India
  group: central-bank
  category: Central bank and regulator of banks and payment systems
  headquarters: Mumbai
  employeesNote: not yet sourced
  roles:
  - Regulates and supervises banks and payment systems
  - Runs RTGS and NEFT
