- id: iftas
  short: IFTAS
  full: Indian Financial Technology and Allied Services
  group: rbi-subsidiary
  category: Wholly owned subsidiary of RBI (company under the Companies Act, 2013)
  establishedNote: Took over INFINET, SFMS, the RTGS and NEFT systems and IBCC from IDRBT in February 2015; transferred to RBI in 2019.
