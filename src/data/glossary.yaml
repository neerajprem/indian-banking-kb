  see:
  - dccb
  source: rbi-home
  status: draft
- id: cic
  term: CIC
  expansion: Credit information company, or core investment company
  definition: Usually a credit bureau licensed by RBI that holds borrowers' credit histories. In RBI rules it can also mean a core investment company, a type of NBFC.
  domain: banking
  see: []
  source: rbi-home
  status: draft
- id: api
  term: API
  expansion: Application programming interface
  definition: A defined way for one system to request data or actions from another.
  domain: technology
  see: []
  source: rbi-home
  status: draft
- id: esb
  term: ESB
  expansion: Enterprise service bus
  definition: Middleware that connects many applications through a central hub, often translating messages between them.
  domain: technology
  see:
  - api
  source: rbi-home
  status: draft
- id: bff
  term: BFF
  expansion: Backend for frontend
  definition: A server layer built for one client, such as a mobile app, that shapes data from many services for that client.
  domain: technology
  see: []
  source: rbi-home
  status: draft
- id: mtls
  term: mTLS
  expansion: Mutual TLS
  definition: TLS in which both sides present certificates, so each proves its identity to the other.
  domain: technology
  see: []
  source: rbi-home
  status: draft
