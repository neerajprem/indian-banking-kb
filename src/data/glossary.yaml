  domain: banking
  see: []
  source: rbi-home
  status: draft
- id: sfb
  term: SFB
  expansion: Small finance bank
  definition: A bank licensed by RBI to focus on small businesses, small farmers and others with limited access to banking.
  domain: banking
  see: []
  source: rbi-home
  status: draft
- id: ucb
  term: UCB
  expansion: Urban co-operative bank
  definition: A co-operative bank serving mainly urban and semi-urban areas.
  domain: banking
  see: []
  source: rbi-home
  status: draft
- id: rrb
  term: RRB
  expansion: Regional rural bank
  definition: A bank set up to serve rural areas, jointly owned by the Government of India, a state government and a sponsor bank.
  domain: banking
  see:
  - nabard
  source: rbi-home
  status: draft
- id: dccb
  term: DCCB
  expansion: District central co-operative bank
